name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site público
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatação
        run: pnpm format:check
      - name: Tipos (astro check)
        run: pnpm check
      - name: Testes unitários
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Instalar Chromium
        run: pnpm --filter @lazer/site exec playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        run: pnpm e2e
